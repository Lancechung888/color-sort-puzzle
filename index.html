<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="彩管分類 ColorTube Sort — 把同色水倒進同一試管" />
  <title>彩管分類 ColorTube Sort</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">彩管分類</div>
      <div class="level-badge" id="level-label">關卡 1</div>
    </header>

    <div class="toolbar">
      <button type="button" class="btn" id="btn-undo" disabled title="Undo">撤銷</button>
      <button type="button" class="btn btn-danger" id="btn-restart" title="Restart">重來</button>
      <button type="button" class="btn btn-hint" id="btn-hint" title="Hint">提示</button>
    </div>

    <main class="playfield">
      <div class="tubes-wrap" id="tubes-wrap" aria-label="試管區"></div>
    </main>

    <div class="status-bar" id="moves-label">步數 0</div>

    <!-- Start screen -->
    <div class="overlay show" id="start-screen">
      <div class="modal">
        <p class="subtitle">ColorTube Sort</p>
        <h2>彩管分類</h2>
        <p>
          點選試管取出上方同色液體，再點另一支倒入。<br />
          目標：每支試管只剩一種顏色（或空的）。
        </p>
        <div class="modal-actions">
          <button type="button" class="btn btn-primary" id="btn-start">開始遊戲</button>
        </div>
      </div>
    </div>

    <!-- Win overlay -->
    <div class="overlay" id="win-overlay">
      <div class="modal">
        <h2>勝利！</h2>
        <p>關卡完成 — Level cleared!</p>
        <div class="modal-actions">
          <button type="button" class="btn" id="btn-win-restart">重來</button>
          <button type="button" class="btn btn-primary" id="btn-next">下一關 Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/levels.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
